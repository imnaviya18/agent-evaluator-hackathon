[project]
name = "agent-evaluator-hackathon"
version = "0.1.0"
description = "Local-First Offline AI Agent Evaluator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.1.0",
    "flask-cors>=4.0.0",
    "peewee>=3.17.0",
    "psycopg2-binary>=2.9.9",
    "python-dotenv>=1.0.0",
    "streamlit>=1.30.0",
    "pandas>=2.0.0",
    "plotly>=5.18.0",
    "requests>=2.31.0",
    "ollama>=0.1.6",
    "faker>=33.0.0",
    "pytest>=7.4.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "black>=23.11.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.pyrefly]
extraPaths = [".", "src"]
pythonPath = ".venv/Scripts/python.exe"
